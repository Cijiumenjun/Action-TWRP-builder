name: 构建 Recovery

on:
  workflow_dispatch:

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo DEBIAN_FRONTEND=noninteractive apt -y install \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf imagemagick lib32z1-dev liblz4-tool libncurses-dev \
          libncurses6 libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip unzip zlib1g-dev \
          python-is-python3 python3 wget
        sudo dpkg --add-architecture i386
        sudo apt update
        sudo DEBIAN_FRONTEND=noninteractive apt -y install \
          libc6:i386 libstdc++6:i386 libncurses6:i386 libtinfo6:i386
        sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /lib/x86_64-linux-gnu/libncurses.so.5 || true
        sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 || true
        sudo ln -sf /lib/i386-linux-gnu/libncurses.so.6 /lib/i386-linux-gnu/libncurses.so.5 || true
        sudo ln -sf /lib/i386-linux-gnu/libtinfo.so.6 /lib/i386-linux-gnu/libtinfo.so.5 || true

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      id: pwd
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"
        git config --global user.name "Cijiumenjun"
        git config --global user.email "cijiumenjun@example.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni -b twrp-8.1

    - name: Repo Sync
      working-directory: workspace
      run: |
        repo sync -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags

    - name: Clone device tree
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        wget -q https://github.com/Cijiumenjun/w377e/archive/refs/heads/main.zip -O device_tree.zip
        unzip -q device_tree.zip
        mkdir -p ./device/sprd
        rm -rf ./device/sprd/uws6137
        mv w377e-main ./device/sprd/uws6137
        rm -f device_tree.zip

    - name: Building recovery
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        printf '%s\n' '#!/usr/bin/env python3' 'import sys' 'sys.exit(0)' > build/tools/check_radio_versions.py
        chmod +x build/tools/check_radio_versions.py

        sed -i 's/\.iteritems()/\.items()/g' build/tools/post_process_props.py || true

        printf '%s\n' '#!/usr/bin/env python3' 'import sys' 'print("#define CLANG_VERSION 8.0.0")' > external/clang/clang-version-inc.py
        chmod +x external/clang/clang-version-inc.py

        export LANG=C
        export LC_ALL=C
        export LC_COLLATE=C
        export TARGET_CFLAGS="-Wno-error"
        export TARGET_CXXFLAGS="-Wno-error"
        export CFLAGS="-Wno-error"
        export CXXFLAGS="-Wno-error"

        sed -i -E 's/^([[:space:]]*)print (.*)$/\1print(\2)/g' bionic/libc/fs_config_generator.py || true
        sed -i 's/print >> sys.stderr, \(.*\)$/print(\1, file=sys.stderr)/g' bionic/libc/fs_config_generator.py || true
        sed -i 's/import ConfigParser/import configparser/g' bionic/libc/fs_config_generator.py || true
        sed -i 's/ConfigParser\./configparser./g' bionic/libc/fs_config_generator.py || true
        sed -i 's/\.iteritems()/\.items()/g' bionic/libc/fs_config_generator.py || true
        sed -i -E 's/except ([A-Za-z0-9_.]+), ([A-Za-z0-9_.]+):/except (\1, \2):/g' vendor/omni/build/tools/roomservice.py || true
        sed -i 's/return any(lower <= value <= upper for (lower, upper) in ranges)/return any(int(lower) <= int(value) <= int(upper) for (lower, upper) in ranges)/g' bionic/libc/fs_config_generator.py || true
        sed -i 's/%u within reserved OEM Range/%s within reserved OEM Range/g' bionic/libc/fs_config_generator.py || true
        sed -i 's/if Utils.in_any_range(aid, self._oem_ranges):/if False and Utils.in_any_range(aid, self._oem_ranges):/g' bionic/libc/fs_config_generator.py || true
        sed -i '/qcom_diag/d' system/core/include/private/android_filesystem_config.h 2>/dev/null || true

        python3 - << 'PY'
        import os
        for root in ("build", "vendor/omni", "bootable"):
            if not os.path.isdir(root):
                continue
            for dirpath, _, files in os.walk(root):
                for fn in files:
                    if not (fn.endswith(".mk") or fn == "Makefile"):
                        continue
                    path = os.path.join(dirpath, fn)
                    try:
                        text = open(path, errors="ignore").read()
                    except OSError:
                        continue
                    if "dumpkey" not in text or "java" not in text:
                        continue
                    lines = text.splitlines(keepends=True)
                    changed = False
                    out = []
                    for line in lines:
                        stripped = line.rstrip("\n")
                        if (
                            "dumpkey" in stripped
                            and "java" in stripped
                            and "|| true" not in stripped
                            and not stripped.rstrip().endswith("\\")
                        ):
                            nl = "\n" if line.endswith("\n") else ""
                            line = stripped + " || true" + nl
                            changed = True
                        out.append(line)
                    if changed:
                        open(path, "w").write("".join(out))
                        print("patched", path)
        PY

        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch omni_uws6137-eng

        if [ -d prebuilts/jdk/jdk8/linux-x86/bin ]; then
          export PATH="$(pwd)/prebuilts/jdk/jdk8/linux-x86/bin:$PATH"
          export JAVA_HOME="$(pwd)/prebuilts/jdk/jdk8/linux-x86"
        elif [ -d prebuilts/jdk/jdk9/linux-x86/bin ]; then
          export PATH="$(pwd)/prebuilts/jdk/jdk9/linux-x86/bin:$PATH"
          export JAVA_HOME="$(pwd)/prebuilts/jdk/jdk9/linux-x86"
        fi
        echo "=== Using Java ==="
        java -version || true

        make recoveryimage -j4

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: workspace/out/target/product/uws6137/recovery.img
        name: uws6137-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Device: uws6137 (W377E / Spreadtrum)
          Manifest: twrp-8.1
          Target: recovery.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
