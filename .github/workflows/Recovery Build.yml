        cd /tmp/dk_manifest
        zip -r "$JAR_ABS" META-INF/
        cd "$ORIG_DIR"

        echo "===== MANIFEST after fix ====="
        unzip -p "$JAR_OUT" META-INF/MANIFEST.MF
        echo ""

        echo "===== DumpPublicKey.class in jar ====="
        unzip -l "$JAR_OUT" | grep -i DumpPublicKey || echo "WARNING: DumpPublicKey.class not found"
        echo ""

        # ============================================================
        # 8. 完整构建
        # ============================================================
        echo "===== Full build ====="
        make recoveryimage -j4

    - name: Upload recovery image
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: recovery-uws6137-${{ github.run_id }}
        path: workspace/out/target/product/uws6137/recovery.img

